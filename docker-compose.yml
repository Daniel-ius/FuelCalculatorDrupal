services:
  php:
    build: .
    container_name: fuelcalc-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
    environment:
      # Adjust credentials as you like
      - DB_HOST=db
      - DB_NAME=fuelcalc
      - DB_USER=fuelcalc
      - DB_PASS=fuelcalc
    # Install system deps & PHP extensions at container start (dev-friendly)
    command: >
      sh -lc "
        apt-get update &&
        apt-get install -y git unzip libpng-dev libjpeg-dev libonig-dev libxml2-dev libzip-dev &&
        docker-php-ext-configure gd --with-jpeg &&
        docker-php-ext-install gd pdo pdo_mysql opcache zip &&
        php-fpm
      "
    ports:
      - "9000:9000"

  nginx:
    image: nginx:stable
    container_name: fuelcalc-nginx
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:10.11
    container_name: fuelcalc-db
    environment:
      - MYSQL_DATABASE=fuelcalc
      - MYSQL_USER=fuelcalc
      - MYSQL_PASSWORD=fuelcalc
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
